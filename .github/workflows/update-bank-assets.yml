name: Update commercial bank assets
on:
  workflow_dispatch:
  schedule:
    - cron: '25 16 * * 5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FRED series
        run: |
          python3 - <<'PY'
          import csv, io, urllib.request
          from pathlib import Path
          url='https://fred.stlouisfed.org/graph/fredgraph.csv?id=TLAACBW027NBOG'
          req=urllib.request.Request(url,headers={'User-Agent':'MacroMonitor/1.8'})
          with urllib.request.urlopen(req,timeout=30) as response:
              data=response.read().decode('utf-8-sig')
          rows=list(csv.reader(io.StringIO(data)))
          assert rows[0] in (['DATE','TLAACBW027NBOG'],['observation_date','TLAACBW027NBOG'])
          valid=[r for r in rows[1:] if len(r)==2 and r[1] not in ('','.')]
          assert len(valid)>10
          Path('bank_assets.csv').write_text('observation_date,TLAACBW027NBOG\\n'+''.join(','.join(r)+'\\n' for r in valid),encoding='utf-8')
          PY
      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bank_assets.csv
          git diff --cached --quiet || (git commit -m "Update commercial bank assets" && git push)
