name: Update commercial bank assets

on:
  workflow_dispatch:
  schedule:
    - cron: '25 16 * * 5'

permissions:
  contents: write

concurrency:
  group: bank-assets-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FRED series with retries
        shell: bash
        run: |
          set -euo pipefail
          START_DATE=$(date -u -d '180 days ago' +%Y-%m-%d)
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 90 \
            --get 'https://fred.stlouisfed.org/graph/fredgraph.csv' \
            --data-urlencode 'id=TLAACBW027NBOG' \
            --data-urlencode "cosd=${START_DATE}" \
            --output bank_assets.tmp
          python3 - <<'PY'
          import csv
          from pathlib import Path
          from datetime import date
          path = Path('bank_assets.tmp')
          with path.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.reader(f))
          if not rows or rows[0] not in (['DATE', 'TLAACBW027NBOG'], ['observation_date', 'TLAACBW027NBOG']):
              raise ValueError('Unexpected FRED CSV header')
          valid = []
          for row in rows[1:]:
              if len(row) != 2 or row[1] in ('', '.'):
                  continue
              date.fromisoformat(row[0])
              if float(row[1]) <= 0:
                  raise ValueError('Nonpositive asset value')
              valid.append(row)
          if len(valid) < 10:
              raise ValueError('Insufficient valid observations')
          out = Path('bank_assets.csv')
          temp = Path('bank_assets.validated.tmp')
          with temp.open('w', encoding='utf-8', newline='') as f:
              writer = csv.writer(f, lineterminator='\n')
              writer.writerow(['observation_date', 'TLAACBW027NBOG'])
              writer.writerows(valid)
          temp.replace(out)
          print(f'Validated {len(valid)} observations; latest: {valid[-1][0]}')
          PY

      - name: Commit updated CSV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bank_assets.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update commercial bank assets'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
